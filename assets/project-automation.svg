<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#07010f"/>
      <stop offset="100%" style="stop-color:#1e1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="160" y1="0" x2="160" y2="400" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="320" y1="0" x2="320" y2="400" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="480" y1="0" x2="480" y2="400" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <line x1="640" y1="0" x2="640" y2="400" stroke="#8b5cf6" stroke-width="1" opacity="0.12"/>
  <!-- Code lines decoration — left -->
  <rect x="60" y="110" width="180" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="60" y="130" width="120" height="10" rx="5" fill="#8b5cf6" opacity="0.5"/>
  <rect x="60" y="150" width="200" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="60" y="170" width="90"  height="10" rx="5" fill="#f59e0b" opacity="0.5"/>
  <rect x="60" y="190" width="160" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="60" y="210" width="140" height="10" rx="5" fill="#8b5cf6" opacity="0.5"/>
  <rect x="60" y="230" width="100" height="10" rx="5" fill="#a78bfa" opacity="0.4"/>
  <rect x="60" y="250" width="180" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="60" y="270" width="130" height="10" rx="5" fill="#f59e0b" opacity="0.4"/>
  <!-- Central icon -->
  <circle cx="400" cy="200" r="70" fill="#07010f" stroke="url(#accent)" stroke-width="2" opacity="0.95"/>
  <!-- Robot/automation icon -->
  <g transform="translate(370, 170)" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <rect x="5" y="8" width="50" height="40" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="url(#accent)"/>
    <!-- Eyes -->
    <circle cx="20" cy="24" r="5" fill="#8b5cf6"/>
    <circle cx="40" cy="24" r="5" fill="#f59e0b"/>
    <!-- Mouth -->
    <path d="M18 36 Q30 44 42 36" stroke="#a78bfa" stroke-width="2.5" fill="none"/>
    <!-- Antenna -->
    <line x1="30" y1="8" x2="30" y2="0" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="30" cy="-2" r="3" fill="#f59e0b"/>
    <!-- Body -->
    <rect x="10" y="50" width="40" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="url(#accent)"/>
  </g>
  <!-- Code lines decoration — right -->
  <rect x="560" y="110" width="180" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="560" y="130" width="140" height="10" rx="5" fill="#a78bfa" opacity="0.5"/>
  <rect x="560" y="150" width="160" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="560" y="170" width="110" height="10" rx="5" fill="#f59e0b" opacity="0.5"/>
  <rect x="560" y="190" width="180" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="560" y="210" width="90"  height="10" rx="5" fill="#8b5cf6" opacity="0.5"/>
  <rect x="560" y="230" width="150" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <rect x="560" y="250" width="120" height="10" rx="5" fill="#f59e0b" opacity="0.4"/>
  <rect x="560" y="270" width="170" height="10" rx="5" fill="#2a1555" opacity="0.9"/>
  <!-- Label -->
  <text x="400" y="358" font-family="'Inter', -apple-system, sans-serif" font-size="14" fill="rgba(167,139,250,0.7)" text-anchor="middle" letter-spacing="2">TEST AUTOMATION</text>
</svg>
